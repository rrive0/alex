<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="https://img5.pic.in.th/file/secure-sv1/51_20250419035319.png" type="image/x-icon">
  <title>PAYMENT</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .bg-particles {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(255,215,0,0.1) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: moveBg 20s linear infinite;
      z-index: 0;
    }

    @keyframes moveBg {
      from { background-position: 0 0; }
      to { background-position: 100px 100px; }
    }

    .qr-box {
      z-index: 1;
      display: flex;
      gap: 30px;
    }

    .qr-box img {
      width: 300px;
      height: auto;
      border: 5px solid #ffd700;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .qr-box img:hover {
      transform: scale(1.05);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid #ffd700;
      border-radius: 15px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="bg-particles"></div>

  <div class="qr-box">
    <img src="https://img2.pic.in.th/pic/189b33da619cba967.png" alt="QR 1">
    <img src="https://img5.pic.in.th/file/secure-sv1/297c575b0dcd5afe7.png" alt="QR 2">
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="Full Image">
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    document.querySelectorAll(".qr-box img").forEach(img => {
      img.addEventListener("click", () => {
        lightboxImg.src = img.src;
        lightbox.style.display = "flex";
      });
    });

    lightbox.addEventListener("click", () => {
      lightbox.style.display = "none";
    });
  </script>
</body>
</html>
